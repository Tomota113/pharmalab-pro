<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  
  <!-- Glowing Hexagonal Molecular Ring -->
  <polygon points="256,110 370,175 370,305 256,370 142,305 142,175" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" stroke-dasharray="16 8"/>
  
  <!-- Central Medical Cross -->
  <path d="M 220 160 L 292 160 L 292 220 L 352 220 L 352 292 L 292 292 L 292 352 L 220 352 L 220 292 L 160 292 L 160 220 L 220 220 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Satellite Orbiting Atoms -->
  <circle cx="256" cy="110" r="18" fill="#38bdf8"/>
  <circle cx="370" cy="175" r="18" fill="#34d399"/>
  <circle cx="370" cy="305" r="18" fill="#a855f7"/>
  <circle cx="256" cy="370" r="18" fill="#f43f5e"/>
  <circle cx="142" cy="305" r="18" fill="#fbbf24"/>
  <circle cx="142" cy="175" r="18" fill="#2dd4bf"/>
</svg>
